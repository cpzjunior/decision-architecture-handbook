title: "Guía de Arquitectura de Decisiones"
subtitle: "Un enfoque práctico para estructurar, comprender, registrar y evolucionar decisiones"
author: ["Carlos Polachini Zanoveli Junior"]
lang: "es"
rights: "Creative Commons Attribution 4.0 International (CC BY 4.0)"
date: "2026"
description: "La Guía de Arquitectura de Decisiones propone una forma práctica de estructurar, comprender, registrar y evolucionar decisiones en diferentes contextos. Presenta conceptos transversales aplicables a la arquitectura de software, la gestión de proyectos, la transformación organizacional, el emprendimiento y las decisiones personales. Su propósito es ofrecer una capa de comprensión previa a la elección de métodos, permitiendo reconocer la estructura de una decisión, comprender qué necesita evolucionar y utilizar las prácticas más adecuadas para cada contexto."
