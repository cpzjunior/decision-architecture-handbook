title: "Guia de Arquitetura de Decisão"
subtitle: "Uma abordagem prática para estruturar, compreender, registrar e evoluir decisões"
author: ["Carlos Polachini Zanoveli Junior"]
lang: "pt-BR"
rights: "Creative Commons Attribution 4.0 International (CC BY 4.0)"
date: "2026"
description: "O Guia de Arquitetura de Decisão propõe uma forma prática de estruturar, compreender, registrar e evoluir decisões em diferentes contextos. Apresenta conceitos transversais aplicáveis à arquitetura de software, gestão de projetos, transformação organizacional, empreendedorismo e decisões pessoais. Seu propósito é oferecer uma camada de compreensão anterior à escolha de métodos, permitindo reconhecer a estrutura de uma decisão, entender o que precisa evoluir e utilizar as práticas mais adequadas a cada contexto."
